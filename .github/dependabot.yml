# One grouped PR per ecosystem a week, proposing only versions published at least three days
# earlier, Dependabot's default, stated so zizmor checks it stays. Security updates aren't delayed.
# The "chore(deps)" prefix keeps PR titles valid Conventional Commits that release nothing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns: ['*']
    # @n8n/node-cli's lint rules break on TypeScript 7 and ESLint 10, and @types/node follows
    # the oldest Node in engines. Raise these by hand when n8n's tooling supports them.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
